# https://lefthook.dev/configuration/
min_version: 2.1.0
assert_lefthook_installed: true
glob_matcher: doublestar

output:
  - meta
  - summary
  - failure
  - execution_out
  - skips

pre-commit:
  skip:
    - merge
    - rebase
  jobs:
    # Phase 1: format -> pin (piped: workflow YAML が両方の対象に重複するため順序依存)
    - group:
        piped: true
        jobs:
          - name: dprint
            glob: "**/*.{md,yaml,yml,json,toml}"
            run: mise exec -- bunx dprint fmt --allow-no-files {staged_files}
            stage_fixed: true
          - name: pinact
            glob: ".github/{workflows,actions}/**/*.{yml,yaml}"
            run: pinact run {staged_files}
            stage_fixed: true
    # Phase 2: dart format (piped: format -> stage)
    - group:
        piped: true
        jobs:
          - name: dart-format
            glob: "**/*.dart"
            exclude: "**/*.{g,freezed,gen,config,module}.dart"
            run: dart format {staged_files}
            stage_fixed: true
    # Phase 3: lint (parallel: 互いに独立)
    - group:
        parallel: true
        jobs:
          - name: actionlint
            glob: ".github/workflows/**/*.{yml,yaml}"
            run: actionlint --color {staged_files}
            fail_text: "actionlint: GitHub Actions ワークフローの構文エラー。https://github.com/rhysd/actionlint を参照"
          - name: doc-lint
            glob: "**/*.md"
            run: bun run scripts/doc-lint.ts {staged_files}
          - name: flutter-analyze
            glob: "**/*.dart"
            run: flutter analyze --no-pub
            fail_text: "flutter analyze: 静的解析エラー。修正してからコミットしてください"

commit-msg:
  skip:
    - merge
    - rebase
  jobs:
    - name: commitlint
      run: mise exec -- bunx commitlint --edit "$1"
      fail_text: |
        [NG] コミットメッセージが規約に違反しています

        形式: type(scope): 説明
        type: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
        scope (任意): app, core, feature

_post-install: &post-install
  piped: true
  jobs:
    - name: mise-install
      run: |
        echo "[INFO] ツールバージョンを同期しています..."
        mise install
    - name: bun-install
      run: |
        echo "[INFO] 依存関係を同期しています..."
        bun install
    - name: melos-bootstrap
      run: |
        echo "[INFO] Dart 依存関係を同期しています..."
        melos bootstrap

post-merge: *post-install
post-checkout: *post-install
