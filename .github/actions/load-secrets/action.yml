# 1Password から GitHub App 認証情報を取得する Composite Action
#
# 前提: OP_SERVICE_ACCOUNT_TOKEN が呼び出し元から渡されること
# 目的: 1Password シークレット読み込みを一括で行う
---
name: Load Secrets
description: Load GitHub App credentials from 1Password for mamelog-assist-bot

inputs:
  op-service-account-token:
    description: 1Password Service Account Token
    required: true

outputs:
  app-id:
    description: GitHub App ID
    value: ${{ steps.load-secrets.outputs.APP_ID }}
  private-key:
    description: GitHub App private key
    value: ${{ steps.load-secrets.outputs.PRIVATE_KEY }}

runs:
  using: composite
  steps:
    - name: Load secrets
      id: load-secrets
      uses: 1password/load-secrets-action@581a835451841d94ec67812bc2630328883c9c44 # v2.0.0
      with:
        export-env: false
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-service-account-token }}
        APP_ID: op://mamelog-ci/mamelog-assist-bot/app-id
        PRIVATE_KEY: op://mamelog-ci/mamelog-assist-bot/private-key
