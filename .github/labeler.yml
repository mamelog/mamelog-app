# noinspection YAMLSchemaValidation
version: 1

labels:
  # Special labels
  - label: "breaking-change"
    title: "^.+!:"

  # Platform labels
  - label: "platform:ios"
    files:
      - ".+/ios/.+"
      - '.+\.podspec'
      - ".+Podfile"

  - label: "platform:android"
    files:
      - ".+/android/.+"
      - '.+\.gradle'
      - '.+\.kt'

  # Size labels
  - label: "size:XS"
    size:
      below: 10

  - label: "size:S"
    size:
      above: 9
      below: 51

  - label: "size:M"
    size:
      above: 50
      below: 201

  - label: "size:L"
    size:
      above: 200
      below: 501

  - label: "size:XL"
    size:
      above: 500

  # Default labels
  - label: "dependencies"
    branch: "^renovate/"
    files:
      - '.+pubspec\.yaml'
      - '.+pubspec\.lock'

  - label: "ignore-for-release"
    branch: "^renovate/github-actions"

  # Type labels
  - label: "type:feature"
    title: '^feat(?:\(.+?\))?!?:'

  - label: "type:fix"
    title: '^fix(?:\(.+?\))?!?:'

  - label: "type:docs"
    title: '^docs(?:\(.+?\))?!?:'
    files:
      - "docs/.+"
      - '.+README\.md'

  - label: "type:style"
    title: '^style(?:\(.+?\))?!?:'

  - label: "type:refactor"
    title: '^refactor(?:\(.+?\))?!?:'

  - label: "type:perf"
    title: '^perf(?:\(.+?\))?!?:'

  - label: "type:test"
    title: '^test(?:\(.+?\))?!?:'
    files:
      - '.+_test\.dart'
      - ".+/test/.+"

  - label: "type:build"
    title: '^build(?:\(.+?\))?!?:'
    files:
      - '.+pubspec\.yaml'

  - label: "type:ci"
    title: '^ci(?:\(.+?\))?!?:'
    files:
      - '\.github/.+'

  - label: "type:chore"
    title: '^chore(?:\(.+?\))?!?:'

  - label: "type:revert"
    title: '^revert(?:\(.+?\))?!?:'

  # App packages
  - label: "package:app/mobile"
    files:
      - app/mobile/.+

  - label: "package:app/shared"
    files:
      - app/shared/.+

  # Core packages
  - label: "package:core/authenticator"
    files:
      - core/authenticator/.+

  - label: "package:core/common"
    files:
      - core/common/.+

  - label: "package:core/data"
    files:
      - core/data/.+

  - label: "package:core/database"
    files:
      - core/database/.+

  - label: "package:core/database_drift"
    files:
      - core/database_drift/.+

  - label: "package:core/datastore"
    files:
      - core/datastore/.+

  - label: "package:core/datastore_shared_preferences"
    files:
      - core/datastore_shared_preferences/.+

  - label: "package:core/designsystem"
    files:
      - core/designsystem/.+

  - label: "package:core/domain"
    files:
      - core/domain/.+

  - label: "package:core/model"
    files:
      - core/model/.+

  - label: "package:core/network"
    files:
      - core/network/.+

  - label: "package:core/testing"
    files:
      - core/testing/.+

  - label: "package:core/ui"
    files:
      - core/ui/.+

  # Feature packages
  - label: "package:feature/auth"
    files:
      - feature/auth/.+

  - label: "package:feature/capture"
    files:
      - feature/capture/.+

  - label: "package:feature/library"
    files:
      - feature/library/.+

  - label: "package:feature/stats"
    files:
      - feature/stats/.+

  - label: "package:feature/tasting"
    files:
      - feature/tasting/.+
