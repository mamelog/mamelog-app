name: Bug Report
description: バグを報告する
title: "fix: "
labels: ["type:fix"]
body:
  - type: checkboxes
    attributes:
      label: 重複確認
      description: 同様の Issue が存在しないことを確認してください。
      options:
        - label: 同様の Issue が存在しないことを確認しました
          required: true

  - type: textarea
    id: overview
    attributes:
      label: 概要
      description: バグの概要を記述してください。
      placeholder: |
        何が問題か、どのような状況で発生するかを簡潔に記述してください。
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 重要度
      description: バグの重要度を選択してください。
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 影響範囲
      description: このバグが影響する範囲を記述してください。
      placeholder: |
        例: ユーザー認証フロー全体、特定の画面のみ、アクセシビリティ等
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: バグを再現する手順を記述してください。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: 現在の動作
      description: 現在の動作やコードを記述してください。コードブロックも使用できます。
      placeholder: |
        現在どのような動作をしているか、該当コードがあれば記述してください。
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 期待される動作
      description: 期待される正しい動作を記述してください。
      placeholder: |
        本来どのように動作すべきかを記述してください。
    validations:
      required: true

  - type: textarea
    id: recommended-fix
    attributes:
      label: 推奨される修正方法
      description: 修正方法の案があれば記述してください。採用理由・不採用理由も含めると効果的です。
      placeholder: |
        修正方法の案、採用理由、代替案の不採用理由等を記述してください。

  - type: textarea
    id: target-files
    attributes:
      label: 対象ファイル
      description: 修正が必要なファイルが特定できている場合は記述してください。
      placeholder: |
        例: core/designsystem/lib/src/component/button.dart (56-63行目)

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 受け入れ条件
      description: この Issue が完了したと判断するための条件をチェックリスト形式で記述してください。
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] melos run analyze --no-select がパス
    validations:
      required: true

  - type: textarea
    id: test-strategy
    attributes:
      label: テスト方針
      description: テストの方針があれば記述してください。テスト不要の場合はその理由を記述してください。
      placeholder: |
        例: Widget テスト追加、既存テストの修正、目視確認で十分 (理由: ...) 等

  - type: textarea
    id: references
    attributes:
      label: 参考
      description: 参考となるドキュメント、Issue、コード等があればリンクを記述してください。
      placeholder: |
        - 関連 Issue: #xxx
        - 公式ドキュメント: https://...
        - 先例コード: path/to/file.dart (行番号)

  - type: textarea
    id: logs
    attributes:
      label: ログ
      description: バグ発生時のログやスタックトレースがあれば添付してください。
      render: shell
