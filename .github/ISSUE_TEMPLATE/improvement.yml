name: Improvement
description: 既存機能の改善・リファクタリングを提案する
title: "refactor: "
labels: ["type:refactor"]
body:
  - type: checkboxes
    attributes:
      label: 重複確認
      description: 同様の Issue が存在しないことを確認してください。
      options:
        - label: 同様の Issue が存在しないことを確認しました
          required: true

  - type: textarea
    id: overview
    attributes:
      label: 概要
      description: 改善の概要を記述してください。
      placeholder: |
        何を改善したいか、その背景・目的を簡潔に記述してください。
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 重要度
      description: 改善の重要度を選択してください。
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 影響範囲
      description: この改善が影響する範囲を記述してください。
      placeholder: |
        例: コードの可読性、アクセシビリティ、保守性等
    validations:
      required: true

  - type: textarea
    id: current-state
    attributes:
      label: 現在のコード / 動作
      description: 現在の状態やコードを記述してください。
      placeholder: |
        改善前のコードや動作を記述してください。コードブロックも使用できます。

  - type: textarea
    id: recommended-approach
    attributes:
      label: 推奨される改善方法
      description: 改善方法の案があれば記述してください。採用理由・代替案の不採用理由も含めると効果的です。
      placeholder: |
        改善方法の案、採用理由、代替案の不採用理由等を記述してください。

  - type: textarea
    id: target-files
    attributes:
      label: 対象ファイル / パッケージ
      description: 改善対象のファイルやパッケージが特定できている場合は記述してください。
      placeholder: |
        例: core/designsystem/lib/src/component/button.dart (56-63行目)

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 受け入れ条件
      description: この Issue が完了したと判断するための条件をチェックリスト形式で記述してください。
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] melos run analyze --no-select がパス
    validations:
      required: true

  - type: textarea
    id: test-strategy
    attributes:
      label: テスト方針
      description: テストの方針があれば記述してください。テスト不要の場合はその理由を記述してください。
      placeholder: |
        例: 既存テストがパスすることを確認、新規テスト追加、目視確認で十分 (理由: ...) 等

  - type: textarea
    id: references
    attributes:
      label: 参考
      description: 参考となるドキュメント、Issue、コード等があればリンクを記述してください。
      placeholder: |
        - 関連 Issue: #xxx
        - 先例コード: path/to/file.dart (行番号)
        - 公式ドキュメント: https://...
