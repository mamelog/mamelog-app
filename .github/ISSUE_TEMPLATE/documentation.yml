name: Documentation
description: ドキュメントの追加・更新・修正
title: "docs: "
labels: ["type:docs"]
body:
  - type: checkboxes
    attributes:
      label: 重複確認
      description: 同様の Issue が存在しないことを確認してください。
      options:
        - label: 同様の Issue が存在しないことを確認しました
          required: true

  - type: textarea
    id: overview
    attributes:
      label: 概要
      description: ドキュメント変更の概要を記述してください。
      placeholder: |
        何を追加・更新・修正したいか、その背景・目的を簡潔に記述してください。
    validations:
      required: true

  - type: textarea
    id: target-files
    attributes:
      label: 対象ファイル
      description: 対象のドキュメントファイルが特定できている場合は記述してください。
      placeholder: |
        例: README.md, CONTRIBUTING.md, docs/api-spec.md 等

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 受け入れ条件
      description: この Issue が完了したと判断するための条件をチェックリスト形式で記述してください。
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 参考
      description: 参考となるドキュメント、Issue 等があればリンクを記述してください。
      placeholder: |
        - 関連 Issue: #xxx
        - 公式ドキュメント: https://...
