# ファイル変更を検出する再利用可能ワークフロー
#
# 対象: PR およびプッシュイベント
# 目的: パスフィルタリングにより変更されたファイルを特定し、後続ジョブの実行を制御
---
name: "[Reusable] Check for changes in paths"

on:
  workflow_call:
    outputs:
      ci:
        description: "CI 関連ファイルに変更がある場合 true"
        value: ${{ jobs.detect-changes.outputs.ci }}
      docs-structure:
        description: "ドキュメント構造関連ファイルに変更がある場合 true"
        value: ${{ jobs.detect-changes.outputs.docs-structure }}

defaults:
  run:
    shell: bash

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      docs-structure: ${{ steps.filter.outputs.docs-structure }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Detect file changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            ci:
              - '.github/workflows/*.yml'
              - '.github/workflows/*.yaml'

            docs-structure:
              - '**/*.md'
              - 'scripts/doc-lint.ts'
