# ファイル変更を検出する再利用可能ワークフロー
#
# 対象: PR およびプッシュイベント
# 目的: パスフィルタリングにより変更されたファイルを特定し、後続ジョブの実行を制御
---
name: "[Reusable] Check for changes in paths"

on:
  workflow_call:
    outputs:
      ci:
        description: "CI 関連ファイルに変更がある場合 true"
        value: ${{ jobs.detect-changes.outputs.ci }}
      format:
        description: "フォーマット対象ファイルに変更がある場合 true"
        value: ${{ jobs.detect-changes.outputs.format }}
      analyze:
        description: "静的解析対象ファイルに変更がある場合 true"
        value: ${{ jobs.detect-changes.outputs.analyze }}
      test:
        description: "テスト対象ファイルに変更がある場合 true"
        value: ${{ jobs.detect-changes.outputs.test }}
      docs:
        description: "ドキュメントに変更がある場合 true"
        value: ${{ jobs.detect-changes.outputs.docs }}
      src:
        description: "ソースコードに変更がある場合 true"
        value: ${{ jobs.detect-changes.outputs.src }}

defaults:
  run:
    shell: bash

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      format: ${{ steps.filter.outputs.format }}
      analyze: ${{ steps.filter.outputs.analyze }}
      test: ${{ steps.filter.outputs.test }}
      docs: ${{ steps.filter.outputs.docs }}
      src: ${{ steps.filter.outputs.src }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Detect file changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            # CI/CD 設定ファイル (GitHub Actions)
            ci:
              - '.github/actions/**/*.yml'
              - '.github/actions/**/*.yaml'
              - '.github/workflows/*.yml'
              - '.github/workflows/*.yaml'

            # フォーマット対象: dprint 設定 + dprint が管理するファイル (json, markdown, toml, yaml)
            format:
              - 'dprint.json'
              - '**/*.md'
              - '**/*.json'
              - '**/*.toml'
              - '**/*.yml'
              - '**/*.yaml'

            # 静的解析対象: ソースコード (lib/) の変更
            analyze:
              - '.github/workflows/pr-checks.yml'
              - '.github/workflows/_changes.yml'
              - 'mise.toml'
              - 'analysis_options.yaml'
              - 'app/**/lib/**/*'
              - 'core/**/lib/**/*'
              - 'feature/**/lib/**/*'
              - '**/pubspec.yaml'
              - '**/pubspec.lock'

            # テスト対象: ソースコード (lib/) + テストコード (test/) の変更
            test:
              - '.github/workflows/pr-checks.yml'
              - '.github/workflows/_changes.yml'
              - 'mise.toml'
              - 'app/**/lib/**/*'
              - 'app/**/test/**/*'
              - 'core/**/lib/**/*'
              - 'core/**/test/**/*'
              - 'feature/**/lib/**/*'
              - 'feature/**/test/**/*'
              - '**/pubspec.yaml'
              - '**/pubspec.lock'

            # ドキュメント
            docs:
              - '**/*.md'
              - 'scripts/doc-lint.ts'
              - 'docs/**/*'

            # ソースコード (将来のデプロイ WF 等で使用予定)
            src:
              - '**/*.dart'
              - '**/*.yaml'
              - 'pubspec.lock'
