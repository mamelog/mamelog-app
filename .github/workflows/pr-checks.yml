# Pull Request の品質チェックを行うワークフロー
#
# 対象: 全ての Pull Request
# 目的: actionlint, ドキュメント構造リンター
---
name: "PR: Checks"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml

  ci:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1

      - name: Run actionlint
        run: actionlint

  doc-lint:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.docs-structure == 'true'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run document structure lint
        run: bun run lint:docs

  gate:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    needs:
      - ci
      - doc-lint
    permissions: {}
    if: always()
    steps:
      - name: Check job results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
