# Pull Request の品質チェックを行うワークフロー
#
# 対象: 全ての Pull Request
# 目的: actionlint, フォーマット, ドキュメント構造リンター, 静的解析, テスト
---
name: "PR: Checks"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml

  actionlint:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # arm64 未対応ツール (Flutter, CocoaPods 等) を除外
      - name: Setup mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        env:
          MISE_DISABLE_TOOLS: flutter,java,ruby,gem:cocoapods

      - name: Run actionlint
        uses: reviewdog/action-actionlint@e58ee9d111489c31395fbe4857b0be6e7635dbda # v1.70.0
        with:
          filter_mode: nofilter
          level: error
          reporter: github-pr-review

  format:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.format == 'true'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        env:
          MISE_DISABLE_TOOLS: flutter,java,ruby,gem:cocoapods

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run dprint check
        run: bun run format

  doc-lint:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        env:
          MISE_DISABLE_TOOLS: flutter,java,ruby,gem:cocoapods

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run document structure lint
        run: bun run lint:docs

  # x64 必須: Flutter SDK が arm64 Linux ホストを未サポート
  analyze:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.analyze == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.ASSIST_BOT_APP_ID }}
          private-key: ${{ secrets.ASSIST_BOT_PRIVATE_KEY }}

      - name: Setup mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        with:
          github_api_token: ${{ steps.app-token.outputs.token }}

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace

      - name: Run analyze
        run: melos run analyze --no-select

  # x64 必須: Flutter SDK が arm64 Linux ホストを未サポート
  test:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.test == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.ASSIST_BOT_APP_ID }}
          private-key: ${{ secrets.ASSIST_BOT_PRIVATE_KEY }}

      - name: Setup mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        with:
          github_api_token: ${{ steps.app-token.outputs.token }}

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace

      - name: Run test
        run: melos run test --no-select

  gate:
    name: Checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 1
    needs:
      - actionlint
      - format
      - doc-lint
      - analyze
      - test
    permissions: {}
    if: always()
    steps:
      - name: Check job results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
