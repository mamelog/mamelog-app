# 定期的にコードフォーマットを実行し、差分があれば PR を作成するワークフロー
#
# 対象: 手動実行、または平日毎日のスケジュール実行
# 目的: コードフォーマットの自動適用と PR 作成
---
name: Format

on:
  workflow_dispatch:
  schedule:
    # AM 7:00(JST) on weekdays (Mon-Fri)
    - cron: "0 22 * * 1-5"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Load secrets
        id: secrets
        uses: 1password/load-secrets-action@581a835451841d94ec67812bc2630328883c9c44 # v2.0.0
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_ID: op://mamelog-ci/mamelog-assist-bot/app-id
          PRIVATE_KEY: op://mamelog-ci/mamelog-assist-bot/private-key

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: app-token
        with:
          app-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        with:
          github_api_token: ${{ steps.app-token.outputs.token }}

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace

      - name: Run Melos Format
        run: melos run format --no-select

      - name: Check for file changes
        id: diff
        run: |
          if git diff --quiet -- '**/*.dart'; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create format PR
        if: steps.diff.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="workflows/format/$(date +%Y%m%d)/dart"
          git checkout -b "$BRANCH"
          git add -A '*.dart'
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "style: dart format を自動適用"
          git push origin "$BRANCH"
          gh pr create \
            --title "style: dart format を自動適用" \
            --body "Melos format による自動フォーマット PR です。" \
            --label "type:style" \
            --base main \
            --head "$BRANCH"
