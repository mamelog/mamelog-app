# PR 作成時に作成者を自動的にアサインするワークフロー
#
# 対象: PR の作成時
# 目的: PR 作成者の自動アサインによるレビューフロー効率化
---
name: "PR: Assign Author"

on:
  pull_request:
    types: [opened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  assign-author:
    if: ${{ !contains(github.actor, '[bot]') }}
    name: Assign author to PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.ASSIST_BOT_APP_ID }}
          private-key: ${{ secrets.ASSIST_BOT_PRIVATE_KEY }}

      - name: Assign Author
        uses: technote-space/assign-author@9558557c5c4816f38bd06176fbc324ba14bb3160 # v1.6.2
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
