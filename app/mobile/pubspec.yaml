name: mamelog
publish_to: none
resolution: workspace
description: "Mamelog mobile application."
version: 1.0.0+1

environment:
  sdk: ^3.11.1
  flutter: ^3.41.0

dependencies:
  app_shared:
    path: ../shared
  connectivity_plus: ^7.0.0
  core_authenticator:
    path: ../../core/authenticator
  core_common:
    path: ../../core/common
  core_data:
    path: ../../core/data
  core_database:
    path: ../../core/database
  core_database_drift:
    path: ../../core/database_drift
  core_datastore:
    path: ../../core/datastore
  core_datastore_shared_preferences:
    path: ../../core/datastore_shared_preferences
  core_designsystem:
    path: ../../core/designsystem
  core_domain:
    path: ../../core/domain
  core_model:
    path: ../../core/model
  core_network:
    path: ../../core/network
  core_ui:
    path: ../../core/ui
  dio: ^5.8.0
  drift: ^2.25.0
  feature_auth:
    path: ../../feature/auth
  feature_capture:
    path: ../../feature/capture
  feature_library:
    path: ../../feature/library
  feature_tasting:
    path: ../../feature/tasting
