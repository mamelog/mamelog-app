  shared_preferences: ^2.5.2
  sign_in_with_apple: ^6.1.4
  slang: ^4.12.1
  slang_flutter: ^4.12.1

dev_dependencies:
  build_runner: ^2.4.0
  core_testing:
    path: ../../core/testing
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.12.1

flutter:
  uses-material-design: true
